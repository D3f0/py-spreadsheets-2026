[project]
name = "pycon-2026-teaching-spreadsheets-python"
version = "0.1.0"
description = "PyCon KE 2026 material for talk, `Teaching some Python to your spreadsheets`"
readme = "README.md"
authors = [
    { name = "Nahuel Defossé", email = "D3f0@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "invoke-toolkit[full]>=0.0.74",
    "pygrister>=0.10.0",
]

[project.scripts]
py-spreadsheets-2026 = "py-spreadsheets-2026:main"

